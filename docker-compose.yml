services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    image: sellercrew:latest
    env_file:
      - .env
      - .env.local
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    image: sellercrew:latest
    command: ["bun", "src/worker.ts"]
    env_file:
      - .env
      - .env.local
    environment:
      NODE_ENV: production
    depends_on:
      - app
    restart: unless-stopped
